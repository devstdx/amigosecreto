# ============================================================================
#  Cloudflare Pages — RESPALDO (la vía principal es Workers: wrangler.jsonc)
# ============================================================================
#  Desplegar:  npx wrangler pages deploy public --config wrangler.pages.toml
#  En local:   npx wrangler pages dev public --config wrangler.pages.toml
#
#  Los secretos NO van aquí: van en .dev.vars (local) y en
#  `npx wrangler pages secret put` o el dashboard (producción).
#
#  El binding de D1 se declara abajo con el MISMO database_id que en
#  wrangler.jsonc (lo imprime `npx wrangler d1 create amigosecreto`).
# ============================================================================

name = "amigo-secreto"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "amigosecreto"
database_id = "00000000-0000-0000-0000-000000000000"

# Nota: este proyecto no usa `nodejs_compat` porque el backend solo emplea
# D1 y Web Crypto (nada de node:*), lo que reduce el tamaño y el arranque.
